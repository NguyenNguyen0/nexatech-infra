---
- name: Deploy NexaTech application services
  hosts: app
  become: true
  vars_files:
    - ../group_vars/dev.secrets.yml
  vars:
    compose_project_name: "nexatech-{{ app_group | default('app') }}"
    compose_src: "{{ playbook_dir }}/../../docker-compose/{{ compose_file }}"
    compose_dest: "/opt/nexatech/compose/{{ compose_file }}"
    app1_service_env_names:
      - identity-service
      - user-service
      - product-service
      - order-service
      - inventory-service
      - payment-service
      - notification-service
    app2_service_env_names:
      - chat-service
      - shipping-service
      - news-service
      - audit-service
      - storage-service
      - promotion-service
      - agent-service
      - mcp-server
      - recommendation-service
    service_env_names: "{{ app2_service_env_names if app_group | default('app-1') == 'app-2' else app1_service_env_names }}"
    keycloak_internal_url: "http://{{ hostvars[groups['infra'][0]].private_ip | default(hostvars[groups['infra'][0]].ansible_host) }}:9000"
  pre_tasks:
    - name: Use private Keycloak URL for identity-service admin calls
      ansible.builtin.set_fact:
        service_env_files: >-
          {{
            service_env_files | combine({
              'identity-service': (service_env_files['identity-service'] | default({})) | combine({
                'KEYCLOAK_URL': keycloak_internal_url
              })
            }, recursive=True)
          }}
      when: app_group | default('app-1') == 'app-1'
  roles:
    - docker
    - compose_deploy
