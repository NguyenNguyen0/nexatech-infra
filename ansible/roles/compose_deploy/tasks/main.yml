---
- name: Create deploy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ compose_dir }}"
    - "{{ env_dir }}"

- name: Copy compose file
  ansible.builtin.copy:
    src: "{{ compose_src }}"
    dest: "{{ compose_dest }}"
    mode: "0644"

- name: Write shared runtime env file
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ deploy_root }}/runtime.env"
    mode: "0600"

- name: Login to ECR when registry is configured
  ansible.builtin.shell: "aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}"
  changed_when: false
  when: ecr_registry | length > 0

- name: Pull images
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ deploy_root }}/runtime.env -f {{ compose_dest }} pull"
  changed_when: true

- name: Start services
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ deploy_root }}/runtime.env -p {{ compose_project_name }} -f {{ compose_dest }} up -d --remove-orphans"
  changed_when: true
