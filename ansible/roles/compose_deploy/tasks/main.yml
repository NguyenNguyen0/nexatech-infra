---
- name: Create deploy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ compose_dir }}"
    - "{{ env_dir }}"

- name: Write service env files
  ansible.builtin.copy:
    dest: "{{ env_dir }}/{{ item }}.env"
    mode: "0600"
    content: |
      {% for pair in (service_env_files[item] | default({})) | dict2items %}
      {{ pair.key }}={{ pair.value }}
      {% endfor %}
  loop: "{{ service_env_names | default([]) }}"
  no_log: true
  when:
    - service_env_files is defined
    - service_env_files[item] is defined
    - service_env_files[item] | length > 0

- name: Copy compose file
  ansible.builtin.copy:
    src: "{{ compose_src }}"
    dest: "{{ compose_dest }}"
    mode: "0644"

- name: Write shared runtime env file
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ deploy_root }}/runtime.env"
    mode: "0600"

- name: Select services for this host
  ansible.builtin.set_fact:
    compose_target_services: >-
      {{
        service_env_names
        if (deploy_services | default('') | trim | length == 0)
        else service_env_names | intersect((deploy_services | trim).split())
      }}

- name: Show selected compose services
  ansible.builtin.debug:
    msg: "Selected services: {{ compose_target_services | join(' ') if compose_target_services | length > 0 else '<none>' }}"

- name: Login to Docker Hub when credentials are configured
  ansible.builtin.shell: "echo '{{ dockerhub_token }}' | docker login --username '{{ dockerhub_username }}' --password-stdin"
  changed_when: false
  no_log: true
  when:
    - dockerhub_username | default('') | length > 0
    - dockerhub_token | default('') | length > 0
    - compose_target_services | length > 0

- name: Pull images
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ deploy_root }}/runtime.env -f {{ compose_dest }} pull {{ compose_target_services | join(' ') }}"
  changed_when: true
  when:
    - compose_target_services | length > 0
    - pull_images | bool

- name: Start services
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ deploy_root }}/runtime.env -p {{ compose_project_name }} -f {{ compose_dest }} up -d --remove-orphans {{ compose_target_services | join(' ') }}"
  changed_when: true
  when: compose_target_services | length > 0
