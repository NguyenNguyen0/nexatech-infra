---
- name: Create deploy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ compose_dir }}"
    - "{{ env_dir }}"

- name: Copy compose file
  ansible.builtin.copy:
    src: "{{ compose_src }}"
    dest: "{{ compose_dest }}"
    mode: "0644"

- name: Write shared runtime env file
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ deploy_root }}/runtime.env"
    mode: "0600"

- name: Login to Docker Hub when credentials are configured
  ansible.builtin.shell: "echo '{{ dockerhub_token }}' | docker login --username '{{ dockerhub_username }}' --password-stdin"
  changed_when: false
  no_log: true
  when:
    - dockerhub_username | default('') | length > 0
    - dockerhub_token | default('') | length > 0

- name: Pull images
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ deploy_root }}/runtime.env -f {{ compose_dest }} pull"
  changed_when: true

- name: Start services
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ deploy_root }}/runtime.env -p {{ compose_project_name }} -f {{ compose_dest }} up -d --remove-orphans"
  changed_when: true
