stages:
  - .pre
  - validate
  - plan
  - apply
  - deploy
  - .post
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
variables:
  TF_ROOT: terraform
  TF_IN_AUTOMATION: 'true'
  TF_VAR_FILE: environments/dev.tfvars
  ANSIBLE_HOST_KEY_CHECKING: 'False'
  ANSIBLE_FORCE_COLOR: 'true'
  ANSIBLE_ROLES_PATH: $CI_PROJECT_DIR/ansible/roles
.terraform-base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint:
      - ''
  before_script:
    - export AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
.ansible-base:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - pip install --quiet ansible boto3 botocore
    - mkdir -p ~/.ssh
    - echo "$ANSIBLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
terraform:fmt:
  image:
    name: hashicorp/terraform:1.9
    entrypoint:
      - ''
  before_script:
    - export AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
  stage: validate
  script:
    - terraform -chdir=$TF_ROOT fmt -check -recursive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
terraform:validate:
  image:
    name: hashicorp/terraform:1.9
    entrypoint:
      - ''
  before_script:
    - export AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
  stage: validate
  script:
    - terraform -chdir=$TF_ROOT init -backend=false
    - terraform -chdir=$TF_ROOT validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
terraform:plan:dev:
  image:
    name: hashicorp/terraform:1.9
    entrypoint:
      - ''
  before_script:
    - export AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
  stage: plan
  script:
    - terraform -chdir=$TF_ROOT init
    - terraform -chdir=$TF_ROOT plan -var-file=$TF_VAR_FILE -out=dev.tfplan
  artifacts:
    paths:
      - $TF_ROOT/dev.tfplan
      - $TF_ROOT/.terraform.lock.hcl
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
terraform:apply:dev:
  image:
    name: hashicorp/terraform:1.9
    entrypoint:
      - ''
  before_script:
    - export AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
  stage: apply
  needs:
    - job: terraform:plan:dev
      artifacts: true
      optional: false
  script:
    - terraform -chdir=$TF_ROOT init
    - terraform -chdir=$TF_ROOT apply -auto-approve -var-file=$TF_VAR_FILE
    - terraform -chdir=$TF_ROOT output -json > terraform-output.json
    - apk add --no-cache jq bash
    - chmod +x scripts/render-inventory.sh
    - >-
      DOCKERHUB_NAMESPACE=$DOCKERHUB_NAMESPACE
      IMAGE_TAG=${CI_COMMIT_SHORT_SHA:-latest} bash scripts/render-inventory.sh
      terraform-output.json ansible/inventory/dev.ini
  artifacts:
    paths:
      - terraform-output.json
      - ansible/inventory/dev.ini
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: manual
  environment:
    name: dev
.ansible-deploy:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - pip install --quiet ansible boto3 botocore
    - mkdir -p ~/.ssh
    - echo "$ANSIBLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  stage: deploy
  needs:
    - terraform:apply:dev
ansible:deploy:infra:
  image:
    name: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - pip install --quiet ansible boto3 botocore
    - mkdir -p ~/.ssh
    - echo "$ANSIBLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  stage: deploy
  needs:
    - job: terraform:apply:dev
      artifacts: true
      optional: false
  script:
    - >-
      ansible-playbook $CI_PROJECT_DIR/ansible/playbooks/deploy-infra.yml -i
      $CI_PROJECT_DIR/ansible/inventory/dev.ini --limit infra --extra-vars
      "dockerhub_username=${DOCKERHUB_USERNAME}
      dockerhub_token=${DOCKERHUB_TOKEN}
      dockerhub_namespace=${DOCKERHUB_NAMESPACE}
      image_tag=${CI_COMMIT_SHORT_SHA:-latest}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: manual
  environment:
    name: dev
ansible:deploy:app:
  image:
    name: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - pip install --quiet ansible boto3 botocore
    - mkdir -p ~/.ssh
    - echo "$ANSIBLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  stage: deploy
  needs:
    - job: terraform:apply:dev
      artifacts: true
      optional: false
  script:
    - >-
      ansible-playbook $CI_PROJECT_DIR/ansible/playbooks/deploy-app.yml -i
      $CI_PROJECT_DIR/ansible/inventory/dev.ini --limit app --extra-vars
      "dockerhub_username=${DOCKERHUB_USERNAME}
      dockerhub_token=${DOCKERHUB_TOKEN}
      dockerhub_namespace=${DOCKERHUB_NAMESPACE}
      image_tag=${CI_COMMIT_SHORT_SHA:-latest}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: manual
  environment:
    name: dev
default: {}
