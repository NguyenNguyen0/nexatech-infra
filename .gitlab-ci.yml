spec:
  inputs:
    backend_image_tag:
      default: ""
      description: "Docker image tag built by nexatech-backend."
    changed_services:
      default: ""
      description: "Space-separated backend services that should be redeployed."
    image_tag:
      default: latest
      description: "Fallback Docker image tag for manual infra pipelines."
---
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

stages:
  - validate
  - plan
  - apply
  - deploy

variables:
  TF_ROOT: terraform
  TF_IN_AUTOMATION: "true"
  TF_VAR_FILE: "environments/dev.tfvars"
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_ROLES_PATH: "$CI_PROJECT_DIR/ansible/roles"
  PIPELINE_BACKEND_IMAGE_TAG: "$[[ inputs.backend_image_tag ]]"
  PIPELINE_CHANGED_SERVICES: "$[[ inputs.changed_services ]]"
  PIPELINE_IMAGE_TAG: "$[[ inputs.image_tag ]]"

# ─────────────────────────────────────────────
# BASE TEMPLATES
# ─────────────────────────────────────────────

.terraform-base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - export AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}

.ansible-base:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - pip install --quiet ansible boto3 botocore
    - mkdir -p ~/.ssh
    - echo "$ANSIBLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - |
      if [ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
        printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ~/.ansible-vault-pass
        chmod 600 ~/.ansible-vault-pass
        export ANSIBLE_VAULT_PASSWORD_FILE=~/.ansible-vault-pass
      fi

# ─────────────────────────────────────────────
# STAGE: VALIDATE
# ─────────────────────────────────────────────

terraform:fmt:
  extends: .terraform-base
  stage: validate
  script:
    - terraform -chdir=$TF_ROOT fmt -check -recursive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

terraform:validate:
  extends: .terraform-base
  stage: validate
  script:
    - terraform -chdir=$TF_ROOT init -backend=false
    - terraform -chdir=$TF_ROOT validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

# ─────────────────────────────────────────────
# STAGE: PLAN
# ─────────────────────────────────────────────

terraform:plan:dev:
  extends: .terraform-base
  stage: plan
  script:
    - terraform -chdir=$TF_ROOT init
    - terraform -chdir=$TF_ROOT plan -var-file=$TF_VAR_FILE -out=dev.tfplan
  artifacts:
    paths:
      - $TF_ROOT/dev.tfplan
      - $TF_ROOT/.terraform.lock.hcl
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# ─────────────────────────────────────────────
# STAGE: APPLY (manual gate)
# ─────────────────────────────────────────────

terraform:apply:dev:
  extends: .terraform-base
  stage: apply
  needs: ["terraform:plan:dev"]
  script:
    - export DEPLOY_IMAGE_TAG="${PIPELINE_BACKEND_IMAGE_TAG:-${PIPELINE_IMAGE_TAG:-latest}}"
    - 'echo "Pipeline backend image tag input: ${PIPELINE_BACKEND_IMAGE_TAG:-<empty>}"'
    - 'echo "Changed services input: ${PIPELINE_CHANGED_SERVICES:-<all>}"'
    - 'echo "Deploy image tag: $DEPLOY_IMAGE_TAG"'
    - terraform -chdir=$TF_ROOT init
    - terraform -chdir=$TF_ROOT apply -auto-approve -var-file=$TF_VAR_FILE
    - terraform -chdir=$TF_ROOT output -json > terraform-output.json
    - apk add --no-cache jq bash
    - chmod +x scripts/render-inventory.sh
    - DOCKERHUB_NAMESPACE=$DOCKERHUB_NAMESPACE IMAGE_TAG=$DEPLOY_IMAGE_TAG bash scripts/render-inventory.sh terraform-output.json ansible/inventory/dev.ini
  artifacts:
    paths:
      - terraform-output.json
      - ansible/inventory/dev.ini
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual
  environment:
    name: dev

# ─────────────────────────────────────────────
# STAGE: DEPLOY (Ansible)
# ─────────────────────────────────────────────

.ansible-deploy:
  extends: .ansible-base
  stage: deploy
  needs: ["terraform:apply:dev"]

ansible:deploy:infra:
  extends: .ansible-deploy
  script:
    - export DEPLOY_IMAGE_TAG="${PIPELINE_BACKEND_IMAGE_TAG:-${PIPELINE_IMAGE_TAG:-latest}}"
    - 'echo "Pipeline backend image tag input: ${PIPELINE_BACKEND_IMAGE_TAG:-<empty>}"'
    - 'echo "Changed services input: ${PIPELINE_CHANGED_SERVICES:-<all>}"'
    - 'echo "Deploy image tag: $DEPLOY_IMAGE_TAG"'
    - ansible-playbook $CI_PROJECT_DIR/ansible/playbooks/deploy-infra.yml
        -i $CI_PROJECT_DIR/ansible/inventory/dev.ini
        --limit infra
        --extra-vars "dockerhub_username=${DOCKERHUB_USERNAME} dockerhub_token=${DOCKERHUB_TOKEN} dockerhub_namespace=${DOCKERHUB_NAMESPACE} image_tag=${DEPLOY_IMAGE_TAG} deploy_services='${PIPELINE_CHANGED_SERVICES}'"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual
  environment:
    name: dev

ansible:deploy:app:
  extends: .ansible-deploy
  script:
    - export DEPLOY_IMAGE_TAG="${PIPELINE_BACKEND_IMAGE_TAG:-${PIPELINE_IMAGE_TAG:-latest}}"
    - 'echo "Pipeline backend image tag input: ${PIPELINE_BACKEND_IMAGE_TAG:-<empty>}"'
    - 'echo "Changed services input: ${PIPELINE_CHANGED_SERVICES:-<all>}"'
    - 'echo "Deploy image tag: $DEPLOY_IMAGE_TAG"'
    - ansible-playbook $CI_PROJECT_DIR/ansible/playbooks/deploy-app.yml
        -i $CI_PROJECT_DIR/ansible/inventory/dev.ini
        --limit app
        --extra-vars "dockerhub_username=${DOCKERHUB_USERNAME} dockerhub_token=${DOCKERHUB_TOKEN} dockerhub_namespace=${DOCKERHUB_NAMESPACE} image_tag=${DEPLOY_IMAGE_TAG} deploy_services='${PIPELINE_CHANGED_SERVICES}'"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual
  environment:
    name: dev
