services:
  identity-service:
    image: ${ECR_REGISTRY}/identity-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/identity-service.env
        required: false
    environment:
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://INFRA_PRIVATE_IP:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-INFRA_PRIVATE_IP:9092}
    ports:
      - "8082:8082"
    networks:
      - nexatech

