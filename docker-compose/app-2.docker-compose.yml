services:
  chat-service:
    image: ${IMAGE_REGISTRY}/chat-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/chat-service.env
        required: false
    environment:
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://INFRA_PRIVATE_IP:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
    ports:
      - "8089:8089"
    networks:
      - nexatech

  shipping-service:
    image: ${IMAGE_REGISTRY}/shipping-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/shipping-service.env
        required: false
    environment:
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://INFRA_PRIVATE_IP:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-INFRA_PRIVATE_IP:9092}
    ports:
      - "8091:8091"
    networks:
      - nexatech

  news-service:
    image: ${IMAGE_REGISTRY}/news-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/news-service.env
        required: false
    environment:
      SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URI:-http://INFRA_PRIVATE_IP:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-INFRA_PRIVATE_IP:9092}
    ports:
      - "8092:8092"
    networks:
      - nexatech

  audit-service:
    image: ${IMAGE_REGISTRY}/audit-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/audit-service.env
        required: false
    environment:
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://INFRA_PRIVATE_IP:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-INFRA_PRIVATE_IP:9092}
    ports:
      - "8096:8096"
    networks:
      - nexatech

  storage-service:
    image: ${IMAGE_REGISTRY}/storage-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/storage-service.env
        required: false
    environment:
      CONFIG_SERVER_URI: ${CONFIG_SERVER_URI:-http://INFRA_PRIVATE_IP:8888}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
    ports:
      - "8088:8088"
    networks:
      - nexatech

  promotion-service:
    image: ${IMAGE_REGISTRY}/promotion-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["sh", "-c", "npm run migrate && node dist/main"]
    env_file:
      - path: /opt/nexatech/env/promotion-service.env
        required: false
    environment:
      SERVICE_NAME: promotion-service
      EUREKA_ENABLED: "true"
      EUREKA_SERVER_URL: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_IP_ADDRESS: ${HOST_PRIVATE_IP}
      EUREKA_INSTANCE_PORT: "8093"
    ports:
      - "8093:8093"
    networks:
      - nexatech

  agent-service:
    image: ${IMAGE_REGISTRY}/agent-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/agent-service.env
        required: false
    environment:
      EUREKA_SERVER_URL: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
      PORT: ${AGENT_SERVICE_PORT:-8097}
      MCP_SERVER_URL: http://mcp-server:8094
      MCP_META_URL: http://mcp-server:8094
      MCP_ENABLE_DOMAIN_ROUTING: "true"
      MCP_INVENTORY_URL: http://inventory-mcp:8101
      MCP_PRODUCT_URL: http://product-mcp:8102
      MCP_ORDER_URL: http://order-mcp:8103
      MCP_PAYMENT_URL: http://payment-mcp:8104
      MCP_PROMOTION_URL: http://promotion-mcp:8105
      MCP_NEWS_URL: http://news-mcp:8106
      MCP_AUDIT_URL: http://audit-mcp:8107
    ports:
      - "${AGENT_SERVICE_PORT:-8097}:${AGENT_SERVICE_PORT:-8097}"
    networks:
      - nexatech

  mcp-server:
    image: ${IMAGE_REGISTRY}/mcp-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/mcp-server.env
        required: false
    environment:
      EUREKA_SERVER_URL: ${EUREKA_URL:-http://INFRA_PRIVATE_IP:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: ${HOST_PRIVATE_IP}
      SERVICE_NAME: mcp-server
      PORT: "8094"
      MCP_SERVER_PROFILE: meta
      INVENTORY_MCP_URL: http://inventory-mcp:8101
      PRODUCT_MCP_URL: http://product-mcp:8102
      ORDER_MCP_URL: http://order-mcp:8103
      PAYMENT_MCP_URL: http://payment-mcp:8104
      PROMOTION_MCP_URL: http://promotion-mcp:8105
      NEWS_MCP_URL: http://news-mcp:8106
      AUDIT_MCP_URL: http://audit-mcp:8107
    ports:
      - "8094:8094"
    networks:
      - nexatech

  inventory-mcp:
    image: ${IMAGE_REGISTRY}/mcp-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
