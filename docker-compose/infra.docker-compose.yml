services:
  discovery-server:
    image: ${IMAGE_REGISTRY}/discovery-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/discovery-server.env
        required: false
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: discovery-server
    ports:
      - "8761:8761"
    networks:
      - nexatech

  config-server:
    image: ${IMAGE_REGISTRY}/config-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/config-server.env
        required: false
    environment:
      SERVER_PORT: 8888
      EUREKA_INSTANCE_HOSTNAME: config-server
      EUREKA_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server
    networks:
      - nexatech

  api-gateway:
    image: ${IMAGE_REGISTRY}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/api-gateway.env
        required: false
    environment:
      SERVER_PORT: 8080
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://${INFRA_PRIVATE_IP}:9000/realms/nexatech
      PROMOTION_SERVICE_URI: lb://promotion-service
      AGENT_SERVICE_URI: http://${APP2_PRIVATE_IP}:8097
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - nexatech

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--hostname-strict=false", "--import-realm"]
    env_file:
      - path: /opt/nexatech/env/keycloak.env
        required: false
    ports:
      - "9000:8080"
    volumes:
      - /opt/nexatech/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - nexatech

  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    env_file:
      - path: /opt/nexatech/env/kafka.env
        required: false
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${INFRA_PRIVATE_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexatech

networks:
  nexatech:
    name: nexatech

volumes:
  kafka-data:
